<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Elyia — your money, surveyed like a mountain</title>
    <meta
      name="description"
      content="Elyia is the trading, DeFi and portfolio deck for Elysium, HyperEVM and HyperCore: one sentence becomes a route card, every position is a rope, your portfolio is a relief map. Non-custodial, testnet first."
    />
    <meta name="theme-color" content="#F3F0E8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="index,follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Elyia" />
    <meta property="og:title" content="Elyia — your money, surveyed like a mountain" />
    <meta
      property="og:description"
      content="Trade HyperCore, move across HyperEVM and Elysium, and read your risk the way a guide reads terrain."
    />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Pre-paint: choose the sheet before any module runs. An explicit choice
      ("elyia.theme" = day | night, mirrored by src/app/state/documentSync.ts)
      wins; otherwise the site is DAY and the deck (/app, /tg) follows the
      system. The ui store takes over once the entry loads.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var sheet = null;
        var motion = "on";
        try {
          var stored = localStorage.getItem("elyia.theme");
          if (stored === "day" || stored === "night") sheet = stored;
          var raw = localStorage.getItem("elyia-ui");
          var state = raw ? JSON.parse(raw).state : null;
          if (!sheet && state && state.theme === "dark") sheet = "night";
          if (!sheet && state && state.theme === "light") sheet = "day";
          if (state && state.motion === "off") motion = "off";
        } catch (error) {
          sheet = null;
        }
        if (!sheet) {
          var deck = /^\/(app|tg)(\/|$)/.test(location.pathname);
          var dark = false;
          try {
            dark = matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (error) {
            dark = false;
          }
          sheet = deck && dark ? "night" : "day";
        }
        root.setAttribute("data-theme", sheet);
        root.style.colorScheme = sheet === "night" ? "dark" : "light";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", sheet === "night" ? "#0E1512" : "#F3F0E8");
        if (motion === "off") root.setAttribute("data-motion", "off");
      })();
    </script>
    <style>
      html { background-color: #f3f0e8; }
      html[data-theme="night"] { background-color: #0e1512; }
    </style>
    <!--
      Latin web fonts, fetched while the entry loads so headings paint in their
      final face. The build fingerprints these hrefs to the same files the
      @fontsource stylesheets reference (src/styles/fonts.css); the dev server
      cannot serve them at these paths, so nothing is preloaded under it.
    -->
    <template id="el-font-preloads">
      <link rel="preload" as="font" type="font/woff2" crossorigin href="../../node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2" />
      <link rel="preload" as="font" type="font/woff2" crossorigin href="../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2" />
      <link rel="preload" as="font" type="font/woff2" crossorigin href="../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-600-normal.woff2" />
    </template>
    <script>
      (function () {
        if (document.querySelector('script[src$="/@vite/client"]')) return;
        var template = document.getElementById("el-font-preloads");
        var links = template && template.content ? template.content.querySelectorAll("link") : [];
        for (var i = 0; i < links.length; i += 1) document.head.appendChild(links[i].cloneNode(true));
      })();
    </script>
  </head>
  <body>
    <noscript>Elyia needs JavaScript to draw your relief map, read the chain live and let you sign routes in your own wallet.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
